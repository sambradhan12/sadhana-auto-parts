<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Service Request</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="index.html">
          <img src="sad.png" alt="Logo" class="logo">
        </a>
      </header>

    <nav>
        <a href="about.html">About</a>
        <a href="product.html">Products</a>
        <a href="contact.html">Contact</a>
        <a href="customer-portal.html">Customer Portal</a>
        <a href="service-request-portal.html">Service Request Portal</a>
    </nav>

    <section>
        <h1>Submit Your Service Request</h1>
        <form id="serviceRequestForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

            <label for="serviceDetails">Service Request Details</label>
            <textarea id="serviceDetails" name="serviceDetails" rows="5" placeholder="Describe your service request" required></textarea>

            <button type="submit">Submit Request</button>
        </form>
    </section>

    <footer>
        &copy; 2025 Your Company. All rights reserved.
    </footer>

    <script>
        document.getElementById('serviceRequestForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                serviceDetails: document.getElementById('serviceDetails').value
            };

            try {
                const response = await fetch('http://localhost:3000/save-request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert('Your service request has been submitted successfully!');
                    document.getElementById('serviceRequestForm').reset();
                } else {
                    alert('Failed to submit your request. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            }
        });
    </script>
</body>
</html>
